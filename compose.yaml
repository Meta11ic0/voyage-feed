name: voyage-feed

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyage-dev}
      POSTGRES_DB: voyage
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  market:
    build: .
    command: ["serve"]
    environment:
      DATABASE_URL: postgres://voyage:${POSTGRES_PASSWORD:-voyage-dev}@db:5432/voyage?sslmode=disable
      HTTP_ADDR: ":8787"
      MARKET_ID: one-piece-dev
      DATASET_PATH: /app/data/dev.json
      MARKET_SEED: "7"
      TICK_INTERVAL_MS: "1000"
      TRADE_PROBABILITY_BPS: "2000"
      MAX_MOVE_BPS: "20"
      INITIAL_CAP_BUDGET_CENTS: "100000000000"
      EVENT_RETENTION_DAYS: "7"
      MAX_STREAM_CLIENTS: "64"
    ports:
      - "127.0.0.1:8787:8787"
    stop_grace_period: 15s
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/market-simulator", "verify", "--base-url", "http://127.0.0.1:8787", "--market", "one-piece-dev", "--profile", "ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  test-db:
    profiles: ["test"]
    image: postgres:17
    environment:
      POSTGRES_USER: voyage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-voyage-dev}
      POSTGRES_DB: voyage_test
    volumes:
      - test-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voyage -d voyage_test"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  integration:
    profiles: ["test"]
    build:
      context: .
      target: test
    working_dir: /src
    environment:
      GOPROXY: "off"
      DATABASE_URL: postgres://voyage:${POSTGRES_PASSWORD:-voyage-dev}@test-db:5432/voyage_test?sslmode=disable
      ADMIN_DATABASE_URL: postgres://voyage:${POSTGRES_PASSWORD:-voyage-dev}@test-db:5432/postgres?sslmode=disable
    depends_on:
      test-db:
        condition: service_healthy
    restart: "no"
    command: ["bash", "-lc", "set -euo pipefail; go test -race -count=1 -tags=integration ./store/; go test -race -count=1 -tags=integration ./cmd/market-simulator/ ./dataset/ ./engine/ ./httpapi/ ./stream/"]

volumes:
  db-data:
  test-db-data:
